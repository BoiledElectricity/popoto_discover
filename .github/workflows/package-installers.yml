name: Package installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: 1.0.${{ github.run_number }}${{ github.run_attempt }}

jobs:
  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            dpkg-dev \
            fakeroot \
            file \
            libfuse2

      - name: Build Linux packages
        run: ./gradlew --no-daemon clean test packageHost -PpackageVersion="${PACKAGE_VERSION}"

      - name: List Linux artifacts
        run: |
          find build/jpackage/artifacts build/jpackage/installer -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: popoto-discover-linux
          if-no-files-found: error
          path: |
            build/jpackage/artifacts/*.AppImage
            build/jpackage/installer/*.deb

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure macOS Developer ID signing
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_B64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_SIGNING_KEY_USER_NAME: ${{ secrets.MACOS_SIGNING_KEY_USER_NAME }}
        run: ./scripts/ci/import-macos-signing-cert.sh

      - name: Build macOS package
        env:
          MACOS_SIGNING_KEY_USER_NAME: ${{ secrets.MACOS_SIGNING_KEY_USER_NAME }}
        run: |
          args=(--no-daemon clean test packageHost -PpackageVersion="${PACKAGE_VERSION}")
          if [[ "${MACOS_SIGNING_ENABLED:-false}" == "true" ]]; then
            args+=(
              -PmacSign=true
              "-PmacSigningKeyUserName=${MACOS_SIGNING_KEY_USER_NAME}"
              "-PmacSigningKeychain=${MACOS_SIGNING_KEYCHAIN}"
            )
          fi
          ./gradlew "${args[@]}"

      - name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SIGNING_KEY_USER_NAME: ${{ secrets.MACOS_SIGNING_KEY_USER_NAME }}
        run: ./scripts/ci/notarize-macos-dmg.sh

      - name: Test packaged macOS application
        run: ./scripts/ci/smoke-macos-package.sh

      - name: List macOS artifacts
        run: |
          find build/jpackage/installer -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: popoto-discover-macos
          if-no-files-found: error
          path: build/jpackage/installer/*.dmg

  windows:
    name: Windows MSI
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 --no-progress -y
          choco install imagemagick --no-progress -y
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (Test-Path $wixBin) {
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $magick = Get-Command magick.exe -ErrorAction SilentlyContinue
          if ($magick) {
            Split-Path $magick.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify signed Ethernet driver package
        shell: pwsh
        run: .\packaging\windows\selow\verify.ps1

      - name: Build Windows package
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test packageHost "-PpackageVersion=$env:PACKAGE_VERSION"

      - name: List Windows artifacts
        shell: pwsh
        run: Get-ChildItem build\jpackage\installer | Format-List FullName,Length

      - name: Test installed Windows package
        shell: pwsh
        run: .\scripts\ci\smoke-windows-package.ps1

      - name: Upload Windows installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popoto-discover-windows-diagnostics
          if-no-files-found: ignore
          path: |
            build/package-smoke/msi-install.log
            build/reports/tests/test/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: popoto-discover-windows
          if-no-files-found: error
          path: build/jpackage/installer/*.msi
